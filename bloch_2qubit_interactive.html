<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Qubit Interactive Bloch Sphere Simulation</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; background-color: transparent; overflow: hidden; 
        }
        .main-container {
            display: flex; flex-direction: row; align-items: stretch; justify-content: center;
            width: 100%; height: 75%; padding: 0 10px; box-sizing: border-box; gap: 10px;
        }
        .plot-box {
            flex: 1; position: relative; border-radius: 8px; background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
        }
        .plot-div { width: 100%; flex-grow: 1; }
        
        .controls { 
            display: flex; flex-direction: column; gap: 5px; 
            padding: 10px; background: rgba(255, 255, 255, 0.85); 
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            width: 90%; max-width: 900px; margin-bottom: 15px;
            justify-content: center; align-items: center; 
            z-index: 10; font-size: 14px;
        }
        .equation { 
            font-family: monospace; font-size: 14px; background: #f8f9fa; 
            padding: 5px 10px; border-radius: 4px; color: #d63384; 
            font-weight: bold; width: 100%; text-align: center; 
            box-sizing: border-box; border: 1px solid #dee2e6;
        }
        .status-box {
            margin-top: 5px; font-weight: bold; padding: 4px 10px; border-radius: 4px; font-size: 13px; text-align: center;
        }
        
        .gate-sidebar {
            display: flex; flex-direction: column; gap: 8px;
            padding: 15px 10px; background: rgba(255, 255, 255, 0.85);
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10; font-size: 14px; width: 85px; align-items: stretch;
            overflow-y: auto;
        }
        .gate-sidebar button {
            padding: 5px; border: 1px solid #3498db; background: #ebf5fb; 
            color: #2980b9; font-weight: bold; border-radius: 4px; cursor: pointer;
            transition: 0.2s; font-size: 13px; width: 100%;
        }
        .gate-sidebar button:hover { background: #3498db; color: white; }
        .gate-sidebar button.cnot-btn { background: #fdf2e9; border-color: #e67e22; color: #d35400; font-size: 11px; padding: 5px 2px;}
        .gate-sidebar button.cnot-btn:hover { background: #e67e22; color: white; }
        
        .gate-group { display: flex; flex-direction: column; gap: 4px; }
        .gate-group-title { font-size: 11px; font-weight: bold; color: #7f8c8d; text-align: center; margin-bottom: 2px; }
        hr { width: 100%; border: 0; border-top: 1px solid #ddd; margin: 4px 0; }
        .box-title { position: absolute; top: 10px; left: 10px; font-weight: bold; color: #2c3e50; font-size: 16px; z-index: 5; background: rgba(255,255,255,0.7); padding: 2px 8px; border-radius: 4px;}
        .top-reset { position: absolute; top: 10px; right: 10px; z-index: 5;}
        .top-reset button { padding: 4px 10px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;}
        .top-reset button:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="controls">
        <div class="equation" id="state-eq">|Ψ⟩ = 1|00⟩ + 0|01⟩ + 0|10⟩ + 0|11⟩</div>
        <div id="entanglement-status" class="status-box" style="background: #d4edda; color: #155724;">🟢 Status: Terpisah (Separable State)</div>
    </div>
    
    <div class="main-container">
        <!-- Qubit 1 Controls -->
        <div class="gate-sidebar">
            <div class="gate-group-title" style="color: #2c3e50; font-size: 12px; margin-bottom: 5px;">Q1 GATES</div>
            <div class="gate-group">
                <button onclick="applyGate1(0,0, 1,0, 1,0, 0,0)">X</button>
                <button onclick="applyGate1(0,0, 0,-1, 0,1, 0,0)">Y</button>
                <button onclick="applyGate1(1,0, 0,0, 0,0, -1,0)">Z</button>
                <button onclick="applyGate1(SQRT2_INV,0, SQRT2_INV,0, SQRT2_INV,0, -SQRT2_INV,0)">H</button>
            </div>
            <hr>
            <div class="gate-group">
                <button onclick="applyGate1(SQRT2_INV,0, 0,-SQRT2_INV, 0,-SQRT2_INV, SQRT2_INV,0)">Rx(π/2)</button>
                <button onclick="applyGate1(SQRT2_INV,0, -SQRT2_INV,0, SQRT2_INV,0, SQRT2_INV,0)">Ry(π/2)</button>
                <button onclick="applyGate1(SQRT2_INV, -SQRT2_INV, 0, 0, 0, 0, SQRT2_INV, SQRT2_INV)">Rz(π/2)</button>
            </div>
            <hr>
            <div class="gate-group">
                <button class="cnot-btn" onclick="applyCNOT(1,2)">CNOT(1→2)</button>
            </div>
        </div>

        <div class="plot-box">
            <div class="box-title">Qubit 1 (Kontrol)</div>
            <div id="plot1" class="plot-div"></div>
        </div>

        <div class="plot-box">
            <div class="box-title">Qubit 2 (Target)</div>
            <div class="top-reset"><button onclick="resetState()">Reset</button></div>
            <div id="plot2" class="plot-div"></div>
        </div>

        <!-- Qubit 2 Controls -->
        <div class="gate-sidebar">
            <div class="gate-group-title" style="color: #2c3e50; font-size: 12px; margin-bottom: 5px;">Q2 GATES</div>
            <div class="gate-group">
                <button onclick="applyGate2(0,0, 1,0, 1,0, 0,0)">X</button>
                <button onclick="applyGate2(0,0, 0,-1, 0,1, 0,0)">Y</button>
                <button onclick="applyGate2(1,0, 0,0, 0,0, -1,0)">Z</button>
                <button onclick="applyGate2(SQRT2_INV,0, SQRT2_INV,0, SQRT2_INV,0, -SQRT2_INV,0)">H</button>
            </div>
            <hr>
            <div class="gate-group">
                <button onclick="applyGate2(SQRT2_INV,0, 0,-SQRT2_INV, 0,-SQRT2_INV, SQRT2_INV,0)">Rx(π/2)</button>
                <button onclick="applyGate2(SQRT2_INV,0, -SQRT2_INV,0, SQRT2_INV,0, SQRT2_INV,0)">Ry(π/2)</button>
                <button onclick="applyGate2(SQRT2_INV, -SQRT2_INV, 0, 0, 0, 0, SQRT2_INV, SQRT2_INV)">Rz(π/2)</button>
            </div>
            <hr>
            <div class="gate-group">
                <button class="cnot-btn" onclick="applyCNOT(2,1)">CNOT(2→1)</button>
            </div>
        </div>
    </div>

    <script>
        // Complex math
        const cmul = (a, b) => [a[0]*b[0] - a[1]*b[1], a[0]*b[1] + a[1]*b[0]];
        const cadd = (a, b) => [a[0]+b[0], a[1]+b[1]];
        const cconj = (a) => [a[0], -a[1]];
        const cnorm2 = (a) => a[0]*a[0] + a[1]*a[1];
        const SQRT2_INV = 1 / Math.sqrt(2);

        // Global State: |00>, |01>, |10>, |11>
        let state = {
            c00: [1,0], c01: [0,0], c10: [0,0], c11: [0,0]
        };

        function resetState() {
            state = { c00: [1,0], c01: [0,0], c10: [0,0], c11: [0,0] };
            updateSimulation();
        }

        function applyGate1(u00r, u00i, u01r, u01i, u10r, u10i, u11r, u11i) {
            let u00 = [u00r, u00i], u01 = [u01r, u01i], u10 = [u10r, u10i], u11 = [u11r, u11i];
            let new_c00 = cadd(cmul(u00, state.c00), cmul(u01, state.c10));
            let new_c01 = cadd(cmul(u00, state.c01), cmul(u01, state.c11));
            let new_c10 = cadd(cmul(u10, state.c00), cmul(u11, state.c10));
            let new_c11 = cadd(cmul(u10, state.c01), cmul(u11, state.c11));
            state = { c00: new_c00, c01: new_c01, c10: new_c10, c11: new_c11 };
            updateSimulation();
        }

        function applyGate2(u00r, u00i, u01r, u01i, u10r, u10i, u11r, u11i) {
            let u00 = [u00r, u00i], u01 = [u01r, u01i], u10 = [u10r, u10i], u11 = [u11r, u11i];
            let new_c00 = cadd(cmul(u00, state.c00), cmul(u01, state.c01));
            let new_c01 = cadd(cmul(u10, state.c00), cmul(u11, state.c01));
            let new_c10 = cadd(cmul(u00, state.c10), cmul(u01, state.c11));
            let new_c11 = cadd(cmul(u10, state.c10), cmul(u11, state.c11));
            state = { c00: new_c00, c01: new_c01, c10: new_c10, c11: new_c11 };
            updateSimulation();
        }

        function applyCNOT(control, target) {
            if (control === 1 && target === 2) {
                // Swap |10> and |11>
                state = { c00: state.c00, c01: state.c01, c10: state.c11, c11: state.c10 };
            } else if (control === 2 && target === 1) {
                // Swap |01> and |11>
                state = { c00: state.c00, c01: state.c11, c10: state.c10, c11: state.c01 };
            }
            updateSimulation();
        }

        // Plotly Visualization setup
        function createBlochSphere() {
            const u = [], v = [], x = [], y = [], z = [];
            for (let i = 0; i <= 24; i++) u.push((i * 2 * Math.PI) / 24); 
            for (let i = 0; i <= 12; i++) v.push((i * Math.PI) / 12); 

            for (let i = 0; i < u.length; i++) {
                x.push([]); y.push([]); z.push([]);
                for (let j = 0; j < v.length; j++) {
                    x[i].push(Math.cos(u[i]) * Math.sin(v[j]));
                    y[i].push(Math.sin(u[i]) * Math.sin(v[j]));
                    z[i].push(Math.cos(v[j]));
                }
            }

            const sphere = {
                type: 'surface', x: x, y: y, z: z,
                opacity: 0.15, colorscale: [[0, '#3498db'], [1, '#3498db']], showscale: false, hoverinfo: 'none'
            };
            const axisLine = (ax, ay, az) => ({
                type: 'scatter3d', mode: 'lines', x: ax, y: ay, z: az,
                line: {color: '#7f8c8d', width: 2, dash: 'dot'}, hoverinfo: 'none', showlegend: false
            });

            const labels = {
                type: 'scatter3d',
                mode: 'text',
                x: [1.35, 0, 0, -1.35, 0, 0],
                y: [0, 1.35, 0, 0, -1.35, 0],
                z: [0, 0, 1.35, 0, 0, -1.35],
                text: ['+X (|+⟩)', '+Y (|i⟩)', '+Z (|0⟩)', '-X (|-⟩)', '-Y (|-i⟩)', '-Z (|1⟩)'],
                textfont: {size: 11, color: '#2c3e50', weight: 'bold'},
                showlegend: false,
                hoverinfo: 'none'
            };

            const eqX = [], eqY = [], eqZ = [];
            for (let i = 0; i <= 36; i++) {
                const angle = i * 2 * Math.PI / 36;
                eqX.push(Math.cos(angle));
                eqY.push(Math.sin(angle));
                eqZ.push(0);
            }
            const equator = {
                type: 'scatter3d',
                mode: 'lines',
                x: eqX, y: eqY, z: eqZ,
                line: {color: '#bdc3c7', width: 2},
                hoverinfo: 'none',
                showlegend: false
            };

            return [sphere, 
                axisLine([-1.2, 1.2], [0, 0], [0, 0]), 
                axisLine([0, 0], [-1.2, 1.2], [0, 0]), 
                axisLine([0, 0], [0, 0], [-1.2, 1.2]),
                equator, labels
            ];
        }

        const layoutBase = {
            margin: {l: 0, r: 0, b: 0, t: 0},
            scene: {
                xaxis: {visible: false, range: [-1.5, 1.5]},
                yaxis: {visible: false, range: [-1.5, 1.5]},
                zaxis: {visible: false, range: [-1.5, 1.5]},
                camera: { eye: {x: 1.3, y: 1.3, z: 0.8} }, aspectmode: 'cube'
            },
            paper_bgcolor: 'transparent', plot_bgcolor: 'transparent'
        };

        const vectorTraceTemplate = {
            type: 'scatter3d', mode: 'lines+markers', x: [0,0], y: [0,0], z: [0,1],
            line: {color: '#e74c3c', width: 8}, marker: {size: 6, color: '#c0392b'},
            name: '|ψ⟩', showlegend: false, hoverinfo: 'none'
        };

        Plotly.newPlot('plot1', [...createBlochSphere(), Object.assign({}, vectorTraceTemplate)], layoutBase, {displayModeBar: false});
        Plotly.newPlot('plot2', [...createBlochSphere(), Object.assign({}, vectorTraceTemplate)], layoutBase, {displayModeBar: false});

        function formatAmp(c) {
            let r = c[0], i = c[1];
            if (Math.abs(r) < 1e-5) r = 0;
            if (Math.abs(i) < 1e-5) i = 0;
            if (r === 0 && i === 0) return "0";
            if (i === 0) return r.toFixed(2);
            if (r === 0) return (i === 1 ? "i" : (i === -1 ? "-i" : i.toFixed(2) + "i"));
            return `(${r.toFixed(2)}${i > 0 ? '+' : ''}${i.toFixed(2)}i)`;
        }

        function updateSimulation() {
            // Update Equation
            let s00 = formatAmp(state.c00), s01 = formatAmp(state.c01), s10 = formatAmp(state.c10), s11 = formatAmp(state.c11);
            let eq = `|Ψ⟩ = `;
            let parts = [];
            if(s00 !== "0") parts.push(`${s00}|00⟩`);
            if(s01 !== "0") parts.push(`${s01}|01⟩`);
            if(s10 !== "0") parts.push(`${s10}|10⟩`);
            if(s11 !== "0") parts.push(`${s11}|11⟩`);
            if(parts.length === 0) parts.push("0");
            document.getElementById('state-eq').innerText = "|Ψ⟩ = " + parts.join(" + ");

            // Calculate reduced density matrices
            let p1_00 = cnorm2(state.c00) + cnorm2(state.c01);
            let p1_11 = cnorm2(state.c10) + cnorm2(state.c11);
            let p1_01 = cadd( cmul(state.c00, cconj(state.c10)), cmul(state.c01, cconj(state.c11)) );
            
            let x1 = 2 * p1_01[0];
            let y1 = -2 * p1_01[1];
            let z1 = p1_00 - p1_11;

            let p2_00 = cnorm2(state.c00) + cnorm2(state.c10);
            let p2_11 = cnorm2(state.c01) + cnorm2(state.c11);
            let p2_01 = cadd( cmul(state.c00, cconj(state.c01)), cmul(state.c10, cconj(state.c11)) );
            
            let x2 = 2 * p2_01[0];
            let y2 = -2 * p2_01[1];
            let z2 = p2_00 - p2_11;

            Plotly.restyle('plot1', {'x': [[0, x1]], 'y': [[0, y1]], 'z': [[0, z1]]}, [6]);
            Plotly.restyle('plot2', {'x': [[0, x2]], 'y': [[0, y2]], 'z': [[0, z2]]}, [6]);

            // Entanglement check (purity of reduced density matrix)
            // purity = tr(rho^2) = 0.5 * (1 + x^2 + y^2 + z^2)
            let r1_sq = x1*x1 + y1*y1 + z1*z1;
            let statusEl = document.getElementById('entanglement-status');
            if (r1_sq < 0.95) {
                statusEl.innerText = "🔴 Status: Terbelit (Entangled) - Vektor menyusut karena dekoherensi lokal";
                statusEl.style.background = "#f8d7da";
                statusEl.style.color = "#721c24";
            } else {
                statusEl.innerText = "🟢 Status: Terpisah (Separable State)";
                statusEl.style.background = "#d4edda";
                statusEl.style.color = "#155724";
            }
        }

        updateSimulation();
    </script>
</body>
</html>
