<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Bloch Sphere with Gates</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; background-color: transparent; overflow: hidden; 
        }
        .main-container {
            display: flex; flex-direction: row; align-items: center; justify-content: center;
            width: 100%; height: 85%;
        }
        #plot { width: 100%; height: 100%; flex-grow: 1; }
        .controls { 
            display: flex; flex-direction: column; gap: 8px; 
            padding: 10px; background: rgba(255, 255, 255, 0.85); 
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            width: 90%; max-width: 400px;
            justify-content: center; align-items: center; 
            z-index: 10; font-size: 14px;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        input[type="range"] { flex-grow: 1; margin: 0 10px; }
        input[type="number"] { width: 50px; padding: 2px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        label { font-weight: bold; color: #2c3e50; min-width: 65px; }
        .equation { 
            font-family: monospace; font-size: 14px; background: #f8f9fa; 
            padding: 5px 10px; border-radius: 4px; color: #d63384; 
            font-weight: bold; width: 100%; text-align: center; 
            box-sizing: border-box; border: 1px solid #dee2e6;
        }
        .gate-sidebar {
            display: flex; flex-direction: column; gap: 10px;
            padding: 15px; background: rgba(255, 255, 255, 0.85);
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10; font-size: 14px; margin-left: 20px;
            width: 80px; align-items: stretch;
        }
        .gate-sidebar button {
            padding: 6px; border: 1px solid #3498db; background: #ebf5fb; 
            color: #2980b9; font-weight: bold; border-radius: 4px; cursor: pointer;
            transition: 0.2s; font-size: 14px; width: 100%;
        }
        .gate-sidebar button:hover {
            background: #3498db; color: white;
        }
        .gate-group {
            display: flex; flex-direction: column; gap: 5px;
        }
        .gate-group-title {
            font-size: 11px; font-weight: bold; color: #7f8c8d; text-align: center; margin-bottom: 2px;
        }
        hr { width: 100%; border: 0; border-top: 1px solid #ddd; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="controls">
        <div class="control-row">
            <label for="theta">θ (Polar)</label>
            <input type="range" id="theta-slider" min="0" max="180" value="0" step="1">
            <div><input type="number" id="theta-input" min="0" max="180" value="0" step="1">°</div>
        </div>
        <div class="control-row">
            <label for="phi">φ (Azimuth)</label>
            <input type="range" id="phi-slider" min="0" max="360" value="0" step="1">
            <div><input type="number" id="phi-input" min="0" max="360" value="0" step="1">°</div>
        </div>
        <div class="equation" id="state-eq">|ψ⟩ = α|0⟩ + β|1⟩</div>
    </div>
    
    <div class="main-container">
        <div class="gate-sidebar">
            <div class="gate-group">
                <div class="gate-group-title">Pauli & H</div>
                <button onclick="applyX()">X</button>
                <button onclick="applyY()">Y</button>
                <button onclick="applyZ()">Z</button>
                <button onclick="applyH()">H</button>
            </div>
            <hr>
            <div class="gate-group">
                <div class="gate-group-title">Rotasi</div>
                <button onclick="applyRx()">Rx(π/2)</button>
                <button onclick="applyRy()">Ry(π/2)</button>
                <button onclick="applyRz()">Rz(π/2)</button>
            </div>
        </div>
        <div id="plot"></div>
    </div>

    <script>
        function createBlochSphere() {
            const u = [], v = [], x = [], y = [], z = [];
            for (let i = 0; i <= 24; i++) u.push((i * 2 * Math.PI) / 24); 
            for (let i = 0; i <= 12; i++) v.push((i * Math.PI) / 12); 

            for (let i = 0; i < u.length; i++) {
                x.push([]); y.push([]); z.push([]);
                for (let j = 0; j < v.length; j++) {
                    x[i].push(Math.cos(u[i]) * Math.sin(v[j]));
                    y[i].push(Math.sin(u[i]) * Math.sin(v[j]));
                    z[i].push(Math.cos(v[j]));
                }
            }

            const sphere = {
                type: 'surface',
                x: x, y: y, z: z,
                opacity: 0.15,
                colorscale: [[0, '#3498db'], [1, '#3498db']],
                showscale: false,
                hoverinfo: 'none'
            };

            const axisLine = (x, y, z) => ({
                type: 'scatter3d',
                mode: 'lines',
                x: x, y: y, z: z,
                line: {color: '#7f8c8d', width: 2, dash: 'dot'},
                hoverinfo: 'none',
                showlegend: false
            });

            const xAxis = axisLine([-1.2, 1.2], [0, 0], [0, 0]);
            const yAxis = axisLine([0, 0], [-1.2, 1.2], [0, 0]);
            const zAxis = axisLine([0, 0], [0, 0], [-1.2, 1.2]);

            const labels = {
                type: 'scatter3d',
                mode: 'text',
                x: [1.35, 0, 0, -1.35, 0, 0],
                y: [0, 1.35, 0, 0, -1.35, 0],
                z: [0, 0, 1.35, 0, 0, -1.35],
                text: ['+X (|+⟩)', '+Y (|i⟩)', '+Z (|0⟩)', '-X (|-⟩)', '-Y (|-i⟩)', '-Z (|1⟩)'],
                textfont: {size: 13, color: '#2c3e50', weight: 'bold'},
                showlegend: false,
                hoverinfo: 'none'
            };

            const eqX = [], eqY = [], eqZ = [];
            for (let i = 0; i <= 36; i++) {
                const angle = i * 2 * Math.PI / 36;
                eqX.push(Math.cos(angle));
                eqY.push(Math.sin(angle));
                eqZ.push(0);
            }
            const equator = {
                type: 'scatter3d',
                mode: 'lines',
                x: eqX, y: eqY, z: eqZ,
                line: {color: '#bdc3c7', width: 2},
                hoverinfo: 'none',
                showlegend: false
            };

            return [sphere, xAxis, yAxis, zAxis, equator, labels];
        }

        const baseData = createBlochSphere();

        const layout = {
            margin: {l: 0, r: 0, b: 0, t: 0},
            scene: {
                xaxis: {visible: false, range: [-1.5, 1.5]},
                yaxis: {visible: false, range: [-1.5, 1.5]},
                zaxis: {visible: false, range: [-1.5, 1.5]},
                camera: { eye: {x: 1.3, y: 1.3, z: 0.8} },
                aspectmode: 'cube'
            },
            paper_bgcolor: 'transparent',
            plot_bgcolor: 'transparent'
        };

        function getVectorData(thetaDeg, phiDeg) {
            const theta = thetaDeg * Math.PI / 180;
            const phi = phiDeg * Math.PI / 180;
            const x = Math.sin(theta) * Math.cos(phi);
            const y = Math.sin(theta) * Math.sin(phi);
            const z = Math.cos(theta);
            return {x: [0, x], y: [0, y], z: [0, z]};
        }
        
        const initVec = getVectorData(0, 0);
        const vectorTrace = {
            type: 'scatter3d',
            mode: 'lines+markers',
            x: initVec.x, y: initVec.y, z: initVec.z,
            line: {color: '#e74c3c', width: 8},
            marker: {size: 6, color: '#c0392b'},
            name: '|ψ⟩',
            showlegend: false,
            hoverinfo: 'none'
        };

        Plotly.newPlot('plot', [...baseData, vectorTrace], layout, {displayModeBar: false});

        function formatCmplx(real, imag) {
            const r = (Math.abs(real) < 1e-10) ? 0 : real;
            const i = (Math.abs(imag) < 1e-10) ? 0 : imag;
            
            if (r === 0 && i === 0) return "0";
            if (i === 0) return r.toFixed(2);
            if (r === 0) return (i === 1 ? "i" : (i === -1 ? "-i" : i.toFixed(2) + "i"));
            
            const sign = i > 0 ? "+" : "-";
            return `(${r.toFixed(2)} ${sign} ${Math.abs(i).toFixed(2)}i)`;
        }

        function updateState() {
            let theta = parseFloat(document.getElementById('theta-input').value);
            let phi = parseFloat(document.getElementById('phi-input').value);
            
            if (theta < 0) theta = 0; if (theta > 180) theta = 180;
            
            const vec = getVectorData(theta, phi);
            
            Plotly.restyle('plot', {
                'x': [vec.x],
                'y': [vec.y],
                'z': [vec.z]
            }, [6]);

            const thetaRad = theta * Math.PI / 180;
            const phiRad = phi * Math.PI / 180;
            
            const alpha = Math.cos(thetaRad / 2);
            const betaMag = Math.sin(thetaRad / 2);
            
            const betaReal = betaMag * Math.cos(phiRad);
            const betaImag = Math.sin(phiRad) * betaMag; // Fix to allow proper phase

            const alphaStr = Math.abs(alpha) < 1e-10 ? "0" : alpha.toFixed(2);
            const betaStr = formatCmplx(betaReal, betaImag);
            
            let sign = "";
            if (betaStr !== "0" && !betaStr.startsWith("-") && !betaStr.startsWith("(")) {
                sign = "+ ";
            } else if (betaStr.startsWith("(")) {
                sign = "+ ";
            }

            let finalStr = `|ψ⟩ = ${alphaStr}|0⟩ `;
            if (betaStr !== "0") {
                finalStr += `${sign}${betaStr}|1⟩`;
            }
            
            document.getElementById('state-eq').innerText = finalStr;
        }

        const sync = (sliderId, inputId) => {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(inputId);
            slider.addEventListener('input', () => { input.value = slider.value; updateState(); });
            input.addEventListener('change', () => { slider.value = input.value; updateState(); });
        };

        sync('theta-slider', 'theta-input');
        sync('phi-slider', 'phi-input');
        
        function applyGate(u00r, u00i, u01r, u01i, u10r, u10i, u11r, u11i) {
            let theta = parseFloat(document.getElementById('theta-input').value) * Math.PI / 180;
            let phi = parseFloat(document.getElementById('phi-input').value) * Math.PI / 180;
            
            let alpha_r = Math.cos(theta / 2);
            let alpha_i = 0;
            let beta_mag = Math.sin(theta / 2);
            let beta_r = beta_mag * Math.cos(phi);
            let beta_i = beta_mag * Math.sin(phi);
            
            let new_alpha_r = u00r * alpha_r - u00i * alpha_i + u01r * beta_r - u01i * beta_i;
            let new_alpha_i = u00r * alpha_i + u00i * alpha_r + u01r * beta_i + u01i * beta_r;
            let new_beta_r = u10r * alpha_r - u10i * alpha_i + u11r * beta_r - u11i * beta_i;
            let new_beta_i = u10r * alpha_i + u10i * alpha_r + u11r * beta_i + u11i * beta_r;
            
            let alpha_mag = Math.sqrt(new_alpha_r*new_alpha_r + new_alpha_i*new_alpha_i);
            let new_theta = 2 * Math.acos(Math.min(1, Math.max(-1, alpha_mag))); 
            
            let alpha_phase = Math.atan2(new_alpha_i, new_alpha_r);
            let beta_phase = Math.atan2(new_beta_i, new_beta_r);
            let new_phi = beta_phase - alpha_phase;
            
            if (new_theta < 1e-5 || Math.PI - new_theta < 1e-5) {
                new_phi = 0; 
            }
            
            let theta_deg = new_theta * 180 / Math.PI;
            let phi_deg = new_phi * 180 / Math.PI;
            
            phi_deg = phi_deg % 360;
            if (phi_deg < 0) phi_deg += 360;
            
            document.getElementById('theta-input').value = Math.round(theta_deg);
            document.getElementById('theta-slider').value = Math.round(theta_deg);
            document.getElementById('phi-input').value = Math.round(phi_deg);
            document.getElementById('phi-slider').value = Math.round(phi_deg);
            
            updateState();
        }

        const SQRT2_INV = 1 / Math.sqrt(2);
        function applyX() { applyGate(0,0, 1,0, 1,0, 0,0); }
        function applyY() { applyGate(0,0, 0,-1, 0,1, 0,0); }
        function applyZ() { applyGate(1,0, 0,0, 0,0, -1,0); }
        function applyH() { applyGate(SQRT2_INV,0, SQRT2_INV,0, SQRT2_INV,0, -SQRT2_INV,0); }
        function applyRx() { applyGate(SQRT2_INV,0, 0,-SQRT2_INV, 0,-SQRT2_INV, SQRT2_INV,0); }
        function applyRy() { applyGate(SQRT2_INV,0, -SQRT2_INV,0, SQRT2_INV,0, SQRT2_INV,0); }
        function applyRz() { applyGate(SQRT2_INV, -SQRT2_INV, 0, 0, 0, 0, SQRT2_INV, SQRT2_INV); }

        updateState();
    </script>
</body>
</html>
